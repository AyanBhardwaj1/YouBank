[package]
name = "youbank-desktop"
version = "0.1.0"
description = "YouBank for desktop: the YouBank site with native extras, and a local agent for files, Office and alerts"
authors = ["YouBank"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.85"

[lib]
name = "youbank_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream", "gzip"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "sync", "fs", "macros"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"
hex = "0.4"
notify = "6"
walkdir = "2"
url = "2"
gethostname = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# The meeting copilot: microphone and loopback capture, and which meeting apps are running.
cpal = "0.18"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# PulseAudio (and PipeWire through pipewire-pulse) lists each output's monitor source, which is how
# system audio is recorded on Linux. A pure-Rust client: no libpulse needed to build.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
