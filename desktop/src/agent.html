<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouBank desktop agent</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { display: grid; grid-template-columns: 210px 1fr; height: 100vh; }
    nav { border-right: 1px solid var(--line); background: var(--panel); padding: 14px 8px; display: flex; flex-direction: column; gap: 2px; }
    nav .brand { display: flex; align-items: center; gap: 8px; padding: 0 8px 12px; font-weight: 600; }
    nav .brand img { width: 20px; height: 20px; }
    nav button { text-align: left; background: none; border: none; color: var(--muted); font: inherit; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
    nav button:hover { color: var(--fg); }
    nav button.on { background: var(--accent-soft); color: var(--accent); }
    nav .foot { margin-top: auto; padding: 8px 10px; font-size: 11px; color: var(--muted); }
    main { overflow-y: auto; padding: 22px 26px 40px; }
    section { max-width: 820px; }
    .item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: none; }
    .consent li { margin-bottom: 4px; }
    .status-indexed { color: var(--pos); }
    .status-failed { color: var(--neg); }
    .status-needsPlan { color: var(--warn); }
  </style>
</head>
<body>
  <nav>
    <div class="brand"><img src="logo.svg" alt="" />Desktop agent</div>
    <button data-section="account">Account</button>
    <button data-section="files">Local files</button>
    <button data-section="office">Excel and PowerPoint</button>
    <button data-section="alerts">Alerts</button>
    <button data-section="tasks">Scheduled tasks</button>
    <button data-section="app">App</button>
    <div class="foot" id="foot"></div>
  </nav>
  <main><section id="view"></section></main>
  <script type="module" src="agent.js"></script>
</body>
</html>
